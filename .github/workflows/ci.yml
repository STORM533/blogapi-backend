name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_sha:
        description: "Existing ECR image SHA to deploy"
        required: true
        type: string

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build docker image
        run: docker build -t blog-api:ci .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::859294994916:role/GitHubActions-BlogAPI
          aws-region: ap-south-1

      - name: Login to amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag blog-api:ci \
            859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fdee6b8008fa7797 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy blog-api ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 859294994916.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}",
              "docker stop blog-api || true",
              "docker rm blog-api || true",
              "docker run -d --name blog-api --restart unless-stopped --memory=512m --read-only --tmpfs /tmp -p 127.0.0.1:3000:3000 --env-file /etc/blog-api/.env -v /etc/blog-api/global-bundle.pem:/etc/blog-api/global-bundle.pem:ro 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}",
              "sleep 5",
              "curl --fail http://127.0.0.1:3000/health/live"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::859294994916:role/GitHubActions-BlogAPI
          aws-region: ap-south-1

      - name: Verify release exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name repo-api \
            --image-ids imageTag="${{ inputs.release_sha }}" \
            --region ap-south-1

      - name: Deploy release to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fdee6b8008fa7797 \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback blog-api to ${{ inputs.release_sha }}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 859294994916.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ inputs.release_sha }}",
              "docker stop blog-api || true",
              "docker rm blog-api || true",
              "docker run -d --name blog-api --restart unless-stopped --memory=512m --read-only --tmpfs /tmp -p 127.0.0.1:3000:3000 --env-file /etc/blog-api/.env -v /etc/blog-api/global-bundle.pem:/etc/blog-api/global-bundle.pem:ro 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ inputs.release_sha }}",
              "sleep 5",
              "curl --fail http://127.0.0.1:3000/health/live"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
