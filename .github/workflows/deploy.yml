name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t blog-api:ci .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::859294994916:role/GitHubActions-BlogAPI
          aws-region: ap-south-1

      - name: Login to amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag blog-api:ci \
            859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fdee6b8008fa7797 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy blog-api ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 859294994916.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}",
              "docker stop blog-api || true",
              "docker rm blog-api || true",
              "docker run -d --name blog-api --restart unless-stopped --memory=512m --read-only --tmpfs /tmp -p 127.0.0.1:3000:3000 --env-file /etc/blog-api/.env -v /etc/blog-api/global-bundle.pem:/etc/blog-api/global-bundle.pem:ro 859294994916.dkr.ecr.ap-south-1.amazonaws.com/repo-api:${{ github.sha }}",
              "sleep 5",
              "curl --fail http://127.0.0.1:3000/health/live"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fdee6b8008fa7797 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
